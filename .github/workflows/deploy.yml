name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Check Supabase config is present
        env:
          # Accept either a repository secret or a repository variable: the
          # anon key is public by design, so people reasonably put it in
          # either place, and reading only one silently produces an
          # offline-mode build that looks fine until sign-in is tried.
          URL_SECRET: ${{ secrets.VITE_SUPABASE_URL }}
          URL_VAR: ${{ vars.VITE_SUPABASE_URL }}
          KEY_SECRET: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          KEY_VAR: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          url="${URL_SECRET:-$URL_VAR}"
          key="${KEY_SECRET:-$KEY_VAR}"
          echo "VITE_SUPABASE_URL      set: $([ -n "$url" ] && echo yes || echo NO)"
          echo "VITE_SUPABASE_ANON_KEY set: $([ -n "$key" ] && echo yes || echo NO)"
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::Supabase config missing. Add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY as *repository* secrets (Settings > Secrets and variables > Actions > Secrets tab). Environment secrets scoped to github-pages are not visible to this job."
            exit 1
          fi

      - name: Build
        env:
          # Project site lives at /<repo>/, so the bundle needs that base
          BASE_PATH: /${{ github.event.repository.name }}/
          # Vite inlines VITE_* at build time. The anon key is public by
          # design - row level security is what protects the data - but it
          # lives in repo secrets rather than the repo itself.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Verify the build is not in offline mode
        # The failure mode this guards against is a deploy that looks green
        # but ships a bundle with no Supabase config, so sign-in silently
        # does nothing for every tester.
        run: |
          if grep -rq "supabase.co" dist/assets/*.js; then
            echo "Supabase config is present in the bundle."
          else
            echo "::error::Built bundle contains no Supabase URL - this would deploy in offline mode."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
